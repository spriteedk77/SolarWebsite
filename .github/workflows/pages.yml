name: Publish website preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAGES: 'true'
      NEXT_PUBLIC_STATIC_PREVIEW: '1'
      NEXT_PUBLIC_SITE_URL: https://spriteedk77.github.io/SolarWebsite

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - run: npm ci
      - run: npm run typecheck

      - name: Remove server-only route from the static preview
        run: rm -rf src/app/api

      - name: Build static preview
        run: npm run build

      - name: Prevent Jekyll processing
        run: touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v5
